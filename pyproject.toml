[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundit"
version = "0.1.0"
description = "FoundIt backend: FastAPI + PostgreSQL (dbmate migrations, sqlc codegen)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
    "pydantic[email]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "asgi-lifespan",
]

# Generated sqlc code lives in db/sqlc but is imported as `foundit_db`
# (the generated files hard-code `from foundit_db import models`).
# This mapping makes it importable without touching generated files.
[tool.setuptools]
packages = ["app", "foundit_db"]

[tool.setuptools.package-dir]
foundit_db = "db/sqlc"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
